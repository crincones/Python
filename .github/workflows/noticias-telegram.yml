# Envia ao Telegram as notícias de 3 estrelas do dia (economic-calendar-investing).
# Token do bot no secret TELEGRAM_TOKEN (Settings > Secrets and variables > Actions).
name: Notícias 3 estrelas no Telegram

on:
  schedule:
    # 10:30 UTC = 07:30 de Brasília, de segunda a sexta.
    # O GitHub pode atrasar execuções agendadas em alguns minutos.
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: economic-calendar-investing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: economic-calendar-investing/requirements.txt
      - run: pip install -r requirements.txt
      - run: python noticias_3_estrelas.py --telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
