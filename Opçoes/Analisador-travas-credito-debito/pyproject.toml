[project]
name = "travas"
version = "0.1.0"
description = "Analisador de travas verticais (alta/baixa, crédito/débito) de opções da B3 via MetaTrader 5"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.143.1",
    "metatrader5==5.0.6180",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "scipy==1.18.1",
    "uvicorn==0.54.0",
]

[project.scripts]
travas = "travas.cli:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not mt5'"
markers = ["mt5: exige o terminal MetaTrader 5 aberto e logado"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE", "S110", "T20"]
