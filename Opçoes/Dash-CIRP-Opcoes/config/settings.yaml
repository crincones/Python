# Configuração do Dash CIRP Opções. Valores marcados "PROVISÓRIO" são padrões iniciais.
# Caminhos relativos são resolvidos a partir da raiz do projeto.
# Os filtros de análise (vencimentos, strikes, liquidez, pesos, vol, juros) também podem ser
# alterados na interface; estes são apenas os padrões.

mt5:
  terminal_path: C:\Users\Carlos\AppData\Roaming\MetaQuotes\Terminal\Metatrader5B3\terminal64.exe
  portable: true                  # o terminal da XP roda com /portable
  # Terminal fechado: o analisador abre minimizado e, ao encerrar, fecha SÓ o que ele abriu.
  launch_if_closed: true
  close_if_launched: true
  startup_timeout_seconds: 180
  startup_stable_seconds: 5
  shutdown_timeout_seconds: 60
  init_retries: 3
  retry_wait_seconds: 2.0
  select_batch_size: 100
  quote_poll_seconds: 0.5
  quote_min_wait_seconds: 1.5
  quote_wait_timeout_seconds: 10.0
  feed_cooldown_seconds: 15.0
  # Na XP o epoch do MT5 é o relógio de parede de Brasília codificado como UTC.
  server_timezone: America/Sao_Paulo

paths:
  holidays_file: config/feriados_b3.csv
  logs_dir: logs
  preferences_file: config/preferencias.json   # preferências da interface (sem credenciais)
  tracking_file: data/acompanhamento.json      # estruturas acompanhadas (fora do git)
  watchlist_file: data/favoritos.json           # ativos com estrela (fora do git)
  quotes_dir: data/cotacoes                    # últimas cotações do pregão (fora do git)
  icons_dir: data/icones                       # ícones dos ativos baixados (fora do git)
  snapshots_dir: data/snapshots                # snapshots baixados do servidor (fora do git)

server:
  host: 127.0.0.1                 # só local
  port: 8765
  open_browser: true

logging:
  level: INFO
  max_bytes: 5000000
  backup_count: 5

collection:
  strike_range_pct_spot: 0.30
  max_dte_business_days: 90
  catalog_cache_minutes: 30
  chain_cache_seconds: 60         # reaproveita a cadeia coletada por até 60 s
  stale_feed_minutes: 15          # tick do ativo mais velho que isso = dados não estão em tempo real
  # Mercado fechado: "b3" = fechamento oficial da B3 (último negócio de cada série, sem bid/ask);
  # "capturas" = últimas cotações capturadas pelo app no pregão (bid/ask de horários diversos);
  # "servidor" = snapshot mais recente do coletor do servidor (bid/ask, ver `snapshots`).
  off_hours_source: b3

# Snapshots da cadeia gravados por `travas snapshot` no servidor com MT5 (systemd, 11:00 e
# 16:30 nos pregões) e servidos por HTTP só na rede Tailscale. O app baixa o mais recente.
snapshots:
  server_url: http://100.113.24.44:8766
  timeout_seconds: 8
  expirations: 3                  # coletor: próximos 3 vencimentos MENSAIS (3ª sexta) de cada ativo
  weekly_max_business_days: 15    # + semanais com até 15 dias úteis (0 = só mensais)
  max_underlyings: 30             # coletor: só os 30 ativos com opções mais líquidas
  liquidity_sessions: 5           # liquidez = volume financeiro médio das opções nesses pregões

liquidity:                        # PROVISÓRIO: mínimos por perna (ajustáveis na interface)
  max_spread_pct_mid: 0.20        # (ask − bid) / mid
  min_mid_price_brl: 0.03
  min_turnover_brl: 5000          # volume financeiro do dia
  min_deals: 5                    # negócios no dia
  max_quote_age_seconds: 300      # idade medida contra o tick mais recente do mesmo lote

pricing:
  # CDI anual (composto em 252 du). Ajustável na interface. Ref.: B3 16/09/2026 = 13,90%.
  risk_free_rate_annual: 0.1390
  iv_lower_bound: 0.01
  iv_upper_bound: 5.0
  iv_tolerance: 1.0e-6
  iv_max_iterations: 100
  atm_max_spread_pct_mid: 0.15
  atm_max_strike_distance_pct: 0.05

analysis:
  dte_min_business_days: 3
  dte_max_business_days: 60
  max_width_pct_spot: 0.15        # largura máxima da trava em % do spot
  quantity: 100                   # opções por perna na simulação
  lot_size: 100                   # valor a investir → quantidade em múltiplos disto
  limit_aggressiveness: 0.25      # preço-limite = mid + 25% do caminho até o preço natural
  illiquid_score_cap: 40          # estruturas com perna reprovada nunca passam disso
  max_results: 300
  weights:                        # somam 1; ajustáveis na interface
    scenario: 0.35
    reward_risk: 0.15
    pop: 0.15
    liquidity: 0.25
    execution_cost: 0.10

# Filtro "Stop 1:1" das travas de crédito (canal Credit Spread Investing): a trava é encerrada
# quando o prejuízo iguala o lucro máximo (custo para desmontar = 2 × crédito). Ranking próprio.
credit_stop:
  loss_multiple: 1.0              # stop quando a perda = 1 × crédito
  paths: 4000                     # Monte Carlo (mesmos sorteios para todas as travas)
  weights:                        # somam 1
    expected: 0.30                # resultado esperado com o stop ÷ perda no stop
    no_stop: 0.30                 # probabilidade de NÃO acionar o stop até o vencimento
    capital: 0.10                 # crédito ÷ garantia (largura − crédito)
    liquidity: 0.20               # pior perna: a saída no stop precisa de liquidez
    exit_cost: 0.10               # (natural − mid) ÷ crédito

# Google Agenda: um evento por vencimento de cada estrutura aberta na Carteira, apagado
# quando ela é encerrada. Conectar na aba Carteira. Credencial OAuth "App para computador"
# (client_secret*.json na raiz do projeto, fora do git); token cifrado em data/google_agenda.json.
google_calendar:
  enabled: true
  calendar_name: "Dash CIRP – Vencimentos"   # agenda criada pelo app (só ela é alterada)
  event_time: "12:00"             # evento no dia do vencimento, horário de Brasília
  event_minutes: 30
  reminders:                      # pregões antes do vencimento + horário (notificação no celular)
    - {business_days_before: 5, time: "12:00"}
    - {business_days_before: 1, time: "12:00"}
    - {business_days_before: 0, time: "12:00"}
  sync_minutes: 30                # além de sincronizar a cada mudança na Carteira

# Cópia da Carteira (abertas e encerradas) e dos favoritos no Google Drive, pela mesma conexão
# Google (escopo drive.file: o app só vê os arquivos que ele criou). O arquivo local continua
# sendo o principal; o Drive recebe a versão atual (com revisões) e uma cópia por dia.
google_drive:
  enabled: true
  folder_name: "Dash CIRP – Carteira"
  daily_history: true             # subpasta "Histórico": acompanhamento_AAAA-MM-DD.json
  sync_minutes: 60                # além de enviar a cada mudança na Carteira
  debounce_seconds: 5             # espera para juntar gravações seguidas num envio só

# Alertas de stop 1:1 (Carteira, checkbox por estrutura aberta): Telegram + e-mail quando o
# ativo alcança o preço em que o prejuízo iguala o lucro máximo. Contatos em telegram-token.txt
# (fora do git); e-mail pela Gmail API da conexão Google (escopo gmail.send). O app checa quando
# recebe cotações com o mercado aberto; o servidor checa a cada 15 min de pregão (redundância).
alerts:
  enabled: true
  server_url: "http://100.113.24.44:8767"   # servidor de alertas no Debian (Tailscale); null = só o app
  timeout_seconds: 5

# Aba "Liquidez de Opções": opções baratas/caras pela razão IV ATM / vol histórica (janela do
# tamanho do prazo), nos próximos vencimentos mensais. Indicativo, não recomendação.
vol_premium:
  expirations: 3
  cheap_below: 0.90               # IV/HV < 0,90 = barata
  expensive_above: 1.20           # IV/HV > 1,20 = cara (a IV costuma ficar acima da HV)
  min_hv_window: 10               # pregões
  weak_book_spread: 0.15          # spread mediano perto do dinheiro acima disto: pouco confiável
  min_book_quotes: 4              # menos séries com bid e ask perto do dinheiro: pouco confiável

# Aba "Ativo protegido" (Rafael Nobre): ativo + put + calls vendidas, piso no vencimento ≥ custo.
protected:
  dte_min_business_days: 5
  dte_max_business_days: 90      # limitado também por collection.max_dte_business_days
  put_min_pct_spot: 0.85          # strikes de put entre 85% e 110% do spot
  put_max_pct_spot: 1.10
  call_max_pct_spot: 1.25         # calls até 125% do spot
  max_wing_pct_spot: 0.08         # borboleta: distância K2 − K1 até 8% do spot
  min_floor_return: 0.0           # 0 = piso ≥ custo ("risco zero"); 0.01 = piso ≥ custo + 1%
  quantity: 100                   # ações (opções: 1 put, 1 ou 2 calls vendidas, 1 call comprada por ação)
  lot_size: 100                   # valor a investir → quantidade arredondada para baixo a múltiplos disto
  limit_aggressiveness: 0.25
  illiquid_score_cap: 40
  max_results: 200
  max_candidates: 4000            # acima disso só as melhores pelo piso são avaliadas por completo
  weights:                        # somam 1; ajustáveis na interface
    floor: 0.30
    unchanged: 0.15
    max: 0.15
    prob_cdi: 0.10
    liquidity: 0.20
    execution_cost: 0.10

early_exercise:
  min_extrinsic_brl: 0.02
  min_extrinsic_pct_premium: 0.02

candles:
  bars: 400          # barras pedidas ao MT5 em 60 min, 240 min, diário e semanal
  monthly_bars: 100  # mensal
  ema_fast: 17
  ema_slow: 72

# Pregão regular de opções da B3 (horário de Brasília). CONFERIR na B3 quando houver mudança de
# horário. Fora deste intervalo, o app usa as últimas cotações capturadas com o mercado aberto.
market_hours:
  session_open: "10:00"
  session_close: "17:55"

# Ícones dos ativos: baixados sob demanda para paths.icons_dir (não versionados). Fonte: repositório
# público thefintz/icones-b3 (sem licença declarada; logos são marcas das respectivas empresas).
icons:
  enabled: true
  source_url: https://raw.githubusercontent.com/thefintz/icones-b3/main/icones/{name}.png
  timeout_seconds: 6
