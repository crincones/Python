[project]
name = "screener"
version = "0.1.0"
description = "Screener de travas de débito em opções de ações da B3 via MetaTrader 5 (XP)"
readme = "CLAUDE.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "duckdb>=1.3",
    "jinja2>=3.1",
    "metatrader5>=5.0.6180",
    "numpy>=2.3",
    "pandas>=2.3",
    "plotly>=6.0",
    "pyarrow>=21.0",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "scipy>=1.16",
    "typer>=0.16",
]

[project.scripts]
screener = "screener.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not mt5 and not network'"
markers = [
    "mt5: exige o terminal MetaTrader 5 aberto e logado",
    "network: acessa a internet (API da B3)",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE", "S110", "T20"]
