[project]
name = "mtf"
version = "0.1.0"
description = "Pesquisa multi-timeframe: tendência D1/H4 + retração H1 em ações da B3 (dados do MetaTrader 5)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "jinja2>=3.1",
    "metatrader5>=5.0.6180",
    "numpy>=2.3",
    "pandas>=2.3",
    "pyarrow>=21.0",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "typer>=0.16",
]

[project.scripts]
mtf = "mtf.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not mt5'"
markers = ["mt5: exige o terminal MetaTrader 5 aberto e logado"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE", "S110", "T20"]
